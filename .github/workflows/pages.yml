name: Build Tianji Yixian gh-pages branch

on:
  push:
    branches: ["main"]
    paths:
      - "tianji-yixian-v0.3.56-web.zip"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tianji-pages-branch
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Prepare Tianji Yixian web release
        run: |
          rm -rf _site
          mkdir -p _site
          test -f tianji-yixian-v0.3.56-web.zip
          unzip -q tianji-yixian-v0.3.56-web.zip -d _site
          test -f _site/index.html
          touch _site/.nojekyll

      - name: Publish static files to gh-pages branch
        run: |
          cd _site
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b gh-pages
          git add -A
          git commit -m "Deploy Tianji Yixian v0.3.56"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git push --force origin gh-pages
