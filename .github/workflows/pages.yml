name: Deploy Tianji Yixian to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "tianji-yixian-v0.3.56-web.zip"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Prepare Tianji Yixian web release
        run: |
          rm -rf _site
          mkdir -p _site
          test -f tianji-yixian-v0.3.56-web.zip
          unzip -q tianji-yixian-v0.3.56-web.zip -d _site
          test -f _site/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
