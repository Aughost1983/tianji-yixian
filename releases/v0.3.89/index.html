<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <title>天机一线 · Demo Scaffold v0.3.89</title>
  <link rel="stylesheet" href="./styles/base.css?v=v0.3.89" />
  <link rel="stylesheet" href="./styles/app.css?v=v0.3.89" />
</head>
<body>
  <div id="app" aria-live="polite"></div>
  <script type="module">
    // Boot failures also offer retry; normal entry remains the original title.
    try {
      await import("./src/main.js?v=v0.3.89");
    } catch (error) {
      let language = "zh-CN";
      try { language = localStorage.getItem("tianji.lang") || language; } catch {}
      const labels = {
        "zh-CN": ["载入中", "程序资源载入失败，请重试。", "重试"],
        en: ["Loading", "Could not load program resources. Please retry.", "Retry"],
        ja: ["読み込み中", "プログラム素材の読み込みに失敗しました。再試行してください。", "再試行"],
      }[language] || ["载入中", "程序资源载入失败，请重试。", "重试"];
      const root = document.getElementById("app");
      root.innerHTML = `<main class="resource-loading-screen" style="position:fixed;inset:0;display:grid;place-items:center;background:#0b1119;color:#d5bd83;padding:24px;text-align:center"><section class="resource-loading-content" style="width:min(100%,340px)"><div class="resource-loading-title">${labels[0]}…</div><div class="resource-loading-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span class="resource-loading-fill" style="width:0%"></span></div><p class="resource-loading-error" role="alert">${labels[1]}</p><button class="resource-loading-retry" type="button">${labels[2]}</button></section></main>`;
      root.querySelector("button").addEventListener("click", () => location.reload());
      console.error("Game bootstrap failed", error);
    }
  </script>
</body>
</html>
